name: Release

# Push a tag like `v0.1.0` to build the Windows installer and attach it to a
# DRAFT GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "2"
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: DotMate ${{ github.ref_name }}
          releaseBody: |
            ## Download
            Get **`DotMate_*_x64-setup.exe`** below and run it. Windows 10/11 (x64).

            The installer is not code-signed yet — if SmartScreen appears, click **More info → Run anyway**.

            See [CHANGELOG.md](https://github.com/shimentosh/dotmate/blob/main/CHANGELOG.md) for what's new.
          releaseDraft: true
          prerelease: false
