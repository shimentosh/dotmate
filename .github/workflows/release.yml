name: Release

# Push a tag like `v0.1.2` to build DotMate and publish a GitHub Release with
# exactly two downloads: the Windows .msi and the macOS (Apple Silicon) .dmg.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: DotMate ${{ github.ref_name }}
          body: |
            ## Download

            | Platform | File |
            |---|---|
            | **Windows 10/11 (x64)** | `DotMate_*_x64_en-US.msi` |
            | **macOS 11+ — Apple Silicon (M1–M4)** | `DotMate_*_aarch64.dmg` |

            **Windows:** the installer is not code-signed yet. If SmartScreen appears, click **More info → Run anyway**.

            **macOS:** the app is not notarized yet. Drag DotMate to Applications, then run once in Terminal:
            ```
            xattr -cr /Applications/DotMate.app
            ```

            See [CHANGELOG.md](https://github.com/shimentosh/dotmate/blob/main/CHANGELOG.md) for what's new.

  build:
    name: Build ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.msi)
            os: windows-latest
            bundle: msi
            file: src-tauri/target/release/bundle/msi/*.msi
          - name: macOS Apple Silicon (.dmg)
            os: macos-latest
            bundle: dmg
            file: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      # WiX (the .msi bundler) runs VBScript custom actions during validation;
      # newer Windows runner images ship without the VBScript feature.
      - name: Enable VBScript for WiX
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: DISM /Online /Add-Capability /CapabilityName:VBSCRIPT~~~~ /NoRestart

      - name: Windows build settings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
          fail_on_unmatched_files: true
