name: 🐛 Bug report
description: Something in DotMate doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search
        [existing issues](https://github.com/shimentosh/dotmate/issues) first.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Quick Trim
        - Clip Merger
        - Image to Video
        - Carousel Video
        - File Shuffler
        - Audio Toolkit
        - AI Voiceover
        - Bulk Voice
        - Speech to Text
        - Script Writer
        - Script to Image Prompts
        - Video Downloader
        - First-run setup
        - Settings / Local AI
        - Installer / app start
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Open Carousel Video
        2. Add 5 images
        3. Click Generate Video
        Expected: … / Actual: …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DotMate version
      description: Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → General → Open logs folder. Paste the relevant part of `errors.log`.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
