name: 💡 Feature request
description: Suggest a new tool or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "When I make Shorts I always have to …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like DotMate to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you use today
      description: Other apps or websites you use for this, if any.
  - type: checkboxes
    id: local
    attributes:
      label: Local-first
      options:
        - label: This can work fully on the user's computer, without a cloud service.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to help build this.
